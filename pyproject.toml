[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]   # HTML templates read better unwrapped
"src/screener/*.py" = ["E501"]       # rule tables and prompts read better unwrapped
"scripts/screen_proposals.py" = ["E501"]
"tests/test_screener.py" = ["E501"]
"tests/test_live.py" = ["E501"]
"scripts/live_register.py" = ["E501"]
"scripts/stress_test.py" = ["E501"]
