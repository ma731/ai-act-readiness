# Unit prices used to turn each survey respondent's health care use into euros.
#
# Source: Osakidetza (Basque public health service), "Tarifas para facturación de servicios
# sanitarios y docentes de Osakidetza para el año 2024", approved by its Board on
# 18 December 2023. These are the prices Osakidetza bills to third parties that owe the cost
# of care (insurers, mutuals), which is the cost concept an insurer prices.
# URL: https://www.osakidetza.euskadi.eus/contenidos/informacion/osk_servic_para_empresas/es_def/adjuntos/LIBRO-DE-TARIFAS-2024-CAS_V2.pdf
#
# `page` is the PDF page, `article` is Osakidetza's own billing code printed next to the price.
# scripts/fetch_data.py downloads the PDF and scripts/verify_tariffs.py checks every line.

