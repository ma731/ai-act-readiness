name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Docs match the rules and committed results
        run: python -m scripts.run_assessment --check

  reproduce:
    # Refit everything from the public data and fail if any published figure moves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.fetch_data
      - run: python -m scripts.run_assessment
      - name: Published figures unchanged
        run: git diff --exit-code -- docs README.md
