name: pages

# Rebuild and publish the site. Every day it also pulls the European Commission's catalogue of
# AI in the EU public sector (Public Sector Tech Watch), screens what is new or changed,
# re-runs the stress test, checks the official AI Act text for changes (opening an issue that
# names the affected code when it changes), and keeps the results on the
# `live-data` branch so main is never written to by a bot.
#
# Optional repository secrets turn on a model reader (otherwise the keyword reader runs):
#   Azure OpenAI:   AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, OPENAI_API_VERSION, AZURE_OPENAI_DEPLOYMENT
#   Claude (Azure): ANTHROPIC_FOUNDRY_API_KEY, ANTHROPIC_FOUNDRY_RESOURCE, SCREENER_MODEL
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # the law watch opens an issue when the AI Act text changes
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
      ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.ANTHROPIC_FOUNDRY_RESOURCE }}
      SCREENER_MODEL: ${{ secrets.SCREENER_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt openai anthropic

      - name: Restore the last live results
        run: |
          if git ls-remote --exit-code origin live-data > /dev/null; then
            git fetch -q origin live-data
            git checkout origin/live-data -- results/live results/generated || true
            git checkout origin/live-data -- results/law 2>/dev/null || true
            git reset -q
            rm -f results/live/nl_register.json   # retired source
          fi

      - name: Screen the EU public-sector AI cases
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m scripts.live_cases ${{ vars.SCREENER_DAILY_LIMIT && format('--limit {0}', vars.SCREENER_DAILY_LIMIT) || '' }}

      - name: Stress test on generated proposals
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m scripts.stress_test --rewrite 20

      # Official text from the EU Publications Office, hashed per article. No model calls.
      # A failed download or an unreadable page is reported here, never as a law change.
      - name: Watch the EU AI Act text
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.law_watch --issue

      - name: Keep the results on the live-data branch
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin live-data > /dev/null; then
            git worktree add -q /tmp/ld origin/live-data && cd /tmp/ld && git checkout -q -B live-data
          else
            git worktree add -q --detach /tmp/ld && cd /tmp/ld && git checkout -q --orphan live-data && git rm -rfq .
          fi
          mkdir -p results
          rm -rf results/live results/generated
          cp -r "$GITHUB_WORKSPACE/results/live" "$GITHUB_WORKSPACE/results/generated" results/
          if [ -d "$GITHUB_WORKSPACE/results/law" ]; then rm -rf results/law && cp -r "$GITHUB_WORKSPACE/results/law" results/; fi
          git add results
          git diff --cached --quiet || git commit -qm "Live data $(date -u +%F)"
          git push -q origin live-data

      - run: python -m scripts.build_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
